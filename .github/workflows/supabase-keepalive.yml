name: Supabase keep-alive

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase REST
        run: |
          code=$(curl -sS -o /dev/null -w "%{http_code}" "${{ secrets.SUPABASE_URL }}/rest/v1/visits?select=id&limit=1" \
            -H "apikey: *** secrets.SUPABASE_ANON_KEY }}" \
            -H "Authorization: Bearer *** secrets.SUPABASE_ANON_KEY }}")
          echo "Supabase keep-alive: HTTP $code at $(date -u +%FT%TZ)" >> "$GITHUB_STEP_SUMMARY"
          test "$code" = "200"
